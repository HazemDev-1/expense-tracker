[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expense-tracker"
version = "1.0.0"
description = "A command-line expense tracker with categories, monthly summaries and budgets."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
expenses = "expense_tracker.cli:main"

[tool.setuptools]
packages = ["expense_tracker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
